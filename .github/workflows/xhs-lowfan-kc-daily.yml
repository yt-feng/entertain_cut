name: XHS Low-Fan KC Daily

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Manual sample size (scheduled runs always make 5)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      output_date:
        description: "Optional delivery date (YYYY-MM-DD); defaults to today in Beijing"
        required: false
        default: ""
        type: string
      avatar_provider:
        description: "Avatar source"
        required: true
        default: "apimart"
        type: choice
        options:
          - "apimart"
          - "local"
      resume_run_id:
        description: "Optional comma-separated failed run IDs to merge and resume"
        required: false
        default: ""
        type: string
      resume_artifact_date:
        description: "Optional date inside legacy artifacts; defaults to output_date"
        required: false
        default: ""
        type: string
  schedule:
    # 20:37 Beijing primary, then 00:37/04:37 compensation for the same UTC business date.
    - cron: "37 12 * * *"
    - cron: "37 16 * * *"
    - cron: "37 20 * * *"

permissions:
  actions: read
  contents: write

concurrency:
  group: xhs-lowfan-kc-daily
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Shanghai
      TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
      APIMART_API_KEY: ${{ secrets.APIMART_API_KEY }}
      JIANGUOYUN_WEBDAV_URL: ${{ secrets.JIANGUOYUN_WEBDAV_URL }}
      JIANGUOYUN_REMOTE_ROOT: ${{ vars.JIANGUOYUN_REMOTE_ROOT || '我的坚果云/KC Desk Notes/Ops' }}
      JIANGUOYUN_USERNAME: ${{ secrets.JIANGUOYUN_WEBDAV_USER || secrets.JIANGUOYUN_WEBDAV_USERNAME || secrets.JIANGUOYUN_USERNAME }}
      JIANGUOYUN_APP_PASSWORD: ${{ secrets.JIANGUOYUN_WEBDAV_PASSWORD || secrets.JIANGUOYUN_APP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          sparse-checkout: |
            xhs2vid
            tools

      - name: Set Beijing date and target count
        shell: bash
        env:
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_OUTPUT_DATE: ${{ inputs.output_date }}
          INPUT_AVATAR_PROVIDER: ${{ inputs.avatar_provider }}
          INPUT_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          INPUT_RESUME_ARTIFACT_DATE: ${{ inputs.resume_artifact_date }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: |
          requested_date=""
          target_count="5"
          avatar_provider="apimart"
          resume_run_ids=""
          resume_artifact_date=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            requested_date="$INPUT_OUTPUT_DATE"
            target_count="$INPUT_LIMIT"
            avatar_provider="$INPUT_AVATAR_PROVIDER"
            resume_run_ids="$INPUT_RESUME_RUN_ID"
            resume_artifact_date="$INPUT_RESUME_ARTIFACT_DATE"
          fi
          run_created_at=""
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            run_created_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          fi
          output_date="$(python3 xhs2vid/workflow_support.py \
            --event "$GITHUB_EVENT_NAME" \
            --requested-date "$requested_date" \
            --schedule-expression "$EVENT_SCHEDULE" \
            --run-created-at "$run_created_at")"
          if [[ -z "$resume_artifact_date" ]]; then
            resume_artifact_date="$output_date"
          fi
          resume_artifact_date="$(python3 xhs2vid/workflow_support.py \
            --event workflow_dispatch \
            --requested-date "$resume_artifact_date")"
          resume_run_ids="$(python3 - "$resume_run_ids" <<'PY'
          import sys

          values = [value.strip() for value in sys.argv[1].split(",") if value.strip()]
          if any(not value.isdigit() for value in values):
              raise SystemExit("resume_run_id must contain only comma-separated numeric run IDs")
          print(",".join(dict.fromkeys(values)))
          PY
          )"
          echo "KC_OUTPUT_DATE=$output_date" >> "$GITHUB_ENV"
          echo "KC_OUTPUT_DIR=outputs/xhs_lowfan/$output_date" >> "$GITHUB_ENV"
          echo "KC_TARGET_COUNT=$target_count" >> "$GITHUB_ENV"
          echo "KC_AVATAR_PROVIDER=$avatar_provider" >> "$GITHUB_ENV"
          echo "KC_RESUME_RUN_IDS=$resume_run_ids" >> "$GITHUB_ENV"
          echo "KC_RESUME_ARTIFACT_DATE=$resume_artifact_date" >> "$GITHUB_ENV"

      - name: Skip a duplicate scheduled delivery
        shell: bash
        run: |
          echo "KC_SKIP=false" >> "$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            exit 0
          fi

          delivered_count="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output_date = os.environ["KC_OUTPUT_DATE"]
          manifest = Path("xhs2vid/state/processed_note_ids.json")
          payload = json.loads(manifest.read_text(encoding="utf-8")) if manifest.is_file() else {"items": []}
          delivered = 0
          for item in payload.get("items", []):
              business_date = str(item.get("delivery_date") or "")
              if business_date:
                  delivered += business_date == output_date
              else:
                  legacy_timestamp = str(item.get("uploaded_at") or item.get("rendered_at") or "")
                  delivered += legacy_timestamp.startswith(output_date)
          print(delivered)
          PY
          )"
          echo "Business-date delivered records: $delivered_count"
          if (( delivered_count >= 5 )); then
            echo "KC_SKIP=true" >> "$GITHUB_ENV"
            echo "Five business-date videos already delivered; skipping this scheduled run."
          fi

      - name: Find reusable partial artifacts
        if: env.KC_SKIP != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$KC_RESUME_RUN_IDS" ]]; then
            echo "Using explicitly requested resume runs: $KC_RESUME_RUN_IDS"
            exit 0
          fi

          artifact_name="xhs-lowfan-kc-$KC_RESUME_ARTIFACT_DATE"
          artifact_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="$artifact_name" \
            -f per_page=100)"
          resume_run_ids="$(jq -r --arg branch "$GITHUB_REF_NAME" '
            [.artifacts[]
              | select(.expired == false)
              | select(.workflow_run.head_branch == $branch)
              | .workflow_run.id
              | tostring]
            | reduce .[] as $id ([]; if index($id) then . else . + [$id] end)
            | .[0:6]
            | join(",")
          ' <<< "$artifact_json")"
          if [[ -n "$resume_run_ids" ]]; then
            echo "KC_RESUME_RUN_IDS=$resume_run_ids" >> "$GITHUB_ENV"
            echo "Found reusable $artifact_name runs: $resume_run_ids"
          else
            echo "No reusable $artifact_name artifacts found."
          fi

      - name: Download prior cloud-rendered outputs
        if: env.KC_SKIP != 'true' && env.KC_RESUME_RUN_IDS != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IFS=',' read -ra run_ids <<< "$KC_RESUME_RUN_IDS"
          for run_id in "${run_ids[@]}"; do
            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              echo "Invalid resume run ID: $run_id"
              exit 1
            fi
            destination="work/xhs_resume/runs/$run_id"
            mkdir -p "$destination"
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "xhs-lowfan-kc-$KC_RESUME_ARTIFACT_DATE" \
              --dir "$destination"
          done

      - name: Set up Python
        if: env.KC_SKIP != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-xhs2vid.txt

      - name: Install media and font dependencies
        if: env.KC_SKIP != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -r requirements-xhs2vid.txt

      - name: Configure batch and optional cloud resume
        if: env.KC_SKIP != 'true'
        shell: bash
        run: |
          mkdir -p work/xhs_daily
          printf 'GitHub run %s\n' "$GITHUB_RUN_ID" > work/xhs_daily/latest_run.txt
          search_pages="1"
          if (( KC_TARGET_COUNT == 5 )); then
            search_pages="3"
          fi
          echo "KC_BATCH_LIMIT=$KC_TARGET_COUNT" >> "$GITHUB_ENV"
          echo "KC_BATCH_START_INDEX=1" >> "$GITHUB_ENV"
          echo "KC_SEARCH_PAGES=$search_pages" >> "$GITHUB_ENV"
          echo "KC_TOP_AUTHOR_CHECK=20" >> "$GITHUB_ENV"
          echo "KC_MAX_ATTEMPTS=2" >> "$GITHUB_ENV"
          echo "KC_REQUEST_LIMIT=90" >> "$GITHUB_ENV"
          echo "KC_PROCESSED_MANIFEST=xhs2vid/state/processed_note_ids.json" >> "$GITHUB_ENV"
          echo "KC_RESUME_PROCESSED=" >> "$GITHUB_ENV"
          echo "KC_UPLOAD_ONLY=false" >> "$GITHUB_ENV"

          if [[ -z "$KC_RESUME_RUN_IDS" ]]; then
            exit 0
          fi

          resume_summary="work/xhs_resume/resume_summary.json"
          python3 xhs2vid/prepare_resume.py \
            --resume-root work/xhs_resume/runs \
            --artifact-date "$KC_RESUME_ARTIFACT_DATE" \
            --output-dir "$KC_OUTPUT_DIR" \
            --target "$KC_TARGET_COUNT" \
            --processed-manifest xhs2vid/state/processed_note_ids.json \
            --validate-media \
            --summary "$resume_summary"
          resume_count="$(jq -r .resumed_count "$resume_summary")"
          prior_tikhub_used="$(jq -r .prior_tikhub_requests "$resume_summary")"
          resume_manifest="$(jq -r .resume_manifest "$resume_summary")"

          if (( resume_count == KC_TARGET_COUNT )); then
            cp "$resume_manifest" "$KC_OUTPUT_DIR/new_processed.json"
            echo "KC_UPLOAD_ONLY=true" >> "$GITHUB_ENV"
            echo "Recovered exactly $resume_count cloud-rendered videos; skipping discovery and rendering."
            exit 0
          fi
          exclusions="work/xhs_resume/processed_exclusions.json"
          cp xhs2vid/state/processed_note_ids.json "$exclusions"
          if (( resume_count > 0 )); then
            python3 xhs2vid/record_processed.py \
              --new "$resume_manifest" \
              --manifest "$exclusions"
          fi

          remaining_tikhub_budget="$((99 - prior_tikhub_used))"
          missing="$((KC_TARGET_COUNT - resume_count))"
          search_pages="2"
          search_calls="32"
          if (( remaining_tikhub_budget < search_calls + missing + 3 + missing )); then
            search_pages="1"
            search_calls="16"
          fi
          top_author_check="$((remaining_tikhub_budget - search_calls - missing - 3))"
          if (( top_author_check > 20 )); then top_author_check="20"; fi
          if (( top_author_check < missing )); then
            echo "Only $remaining_tikhub_budget TikHub requests remain; cannot search and verify $missing missing videos"
            exit 1
          fi

          echo "KC_BATCH_LIMIT=$missing" >> "$GITHUB_ENV"
          echo "KC_BATCH_START_INDEX=$((resume_count + 1))" >> "$GITHUB_ENV"
          echo "KC_SEARCH_PAGES=$search_pages" >> "$GITHUB_ENV"
          echo "KC_TOP_AUTHOR_CHECK=$top_author_check" >> "$GITHUB_ENV"
          echo "KC_MAX_ATTEMPTS=1" >> "$GITHUB_ENV"
          echo "KC_REQUEST_LIMIT=$remaining_tikhub_budget" >> "$GITHUB_ENV"
          echo "KC_PROCESSED_MANIFEST=$exclusions" >> "$GITHUB_ENV"
          echo "KC_RESUME_PROCESSED=$resume_manifest" >> "$GITHUB_ENV"
          echo "Resuming $resume_count cloud-rendered MP4 files; generating $missing more."
          echo "TikHub recovery budget: $remaining_tikhub_budget (prior $prior_tikhub_used; pages $search_pages; author checks $top_author_check)."

      - name: Check required secrets
        if: env.KC_SKIP != 'true'
        shell: bash
        run: |
          missing=()
          for name in JIANGUOYUN_USERNAME JIANGUOYUN_APP_PASSWORD; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if [[ "$KC_UPLOAD_ONLY" != "true" && -z "$TIKHUB_API_KEY" ]]; then
            missing+=("TIKHUB_API_KEY")
          fi
          if [[ "$KC_UPLOAD_ONLY" != "true" && "$KC_AVATAR_PROVIDER" == "apimart" && -z "$APIMART_API_KEY" ]]; then
            missing+=("APIMART_API_KEY")
          fi
          if (( ${#missing[@]} > 0 )); then
            echo "Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Discover and render today's low-follower viral posts
        if: env.KC_SKIP != 'true' && env.KC_UPLOAD_ONLY != 'true'
        run: |
          python xhs2vid/run_daily_batch.py \
            --limit "$KC_BATCH_LIMIT" \
            --date "$KC_OUTPUT_DATE" \
            --pages "$KC_SEARCH_PAGES" \
            --start-index "$KC_BATCH_START_INDEX" \
            --request-limit "$KC_REQUEST_LIMIT" \
            --top-author-check "$KC_TOP_AUTHOR_CHECK" \
            --max-attempts "$KC_MAX_ATTEMPTS" \
            --avatar-provider "$KC_AVATAR_PROVIDER" \
            --processed-manifest "$KC_PROCESSED_MANIFEST" \
            --work-root work/xhs_daily \
            --output-dir "$KC_OUTPUT_DIR"

      - name: Require exactly the requested MP4 count
        if: env.KC_SKIP != 'true'
        shell: bash
        run: |
          shopt -s nullglob
          videos=("$KC_OUTPUT_DIR"/*.mp4)
          if (( ${#videos[@]} != KC_TARGET_COUNT )); then
            echo "Expected exactly $KC_TARGET_COUNT MP4 files; found ${#videos[@]}"
            exit 1
          fi
          for video in "${videos[@]}"; do
            ffmpeg -v error -i "$video" -f null -
            echo "Cloud decode verified: $(basename "$video")"
          done
          combined_processed="$KC_OUTPUT_DIR/combined_processed.json"
          python - "$KC_OUTPUT_DIR" "$KC_TARGET_COUNT" "$KC_RESUME_PROCESSED" "$combined_processed" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          output_dir = Path(sys.argv[1])
          target = int(sys.argv[2])
          resume_processed = Path(sys.argv[3]) if sys.argv[3] else None
          combined_path = Path(sys.argv[4])
          sources = []
          if resume_processed is not None:
              sources.append(resume_processed)
          sources.append(output_dir / "new_processed.json")

          items = []
          for source in sources:
              payload = json.loads(source.read_text(encoding="utf-8"))
              items.extend(payload.get("items") or [])
          note_ids = [str(item.get("note_id") or "") for item in items]
          outputs = [str(item.get("output") or "") for item in items]
          video_names = {path.name for path in output_dir.glob("*.mp4")}
          if len(items) != target or len(set(note_ids)) != target or "" in note_ids:
              raise SystemExit("combined processed manifest is not exactly the requested unique notes")
          if len(set(outputs)) != target or set(outputs) != video_names:
              raise SystemExit("combined processed outputs do not match the exact MP4 set")

          for item in items:
              item["delivery_date"] = output_dir.name

          combined_path.write_text(
              json.dumps({"date": output_dir.name, "items": items}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          cumulative_budget = output_dir / "cumulative_tikhub_request_budget.json"
          prior_payload = (
              json.loads(cumulative_budget.read_text(encoding="utf-8"))
              if cumulative_budget.is_file()
              else {"used": 0, "sources": []}
          )
          prior_used = int(prior_payload.get("used", 0))
          budget_sources = list(prior_payload.get("sources") or [])
          current_budget_path = output_dir / "tikhub_request_budget.json"
          current_used = 0
          if current_budget_path.is_file():
              current_used = int(
                  json.loads(current_budget_path.read_text(encoding="utf-8")).get("used", 0)
              )
          if current_used:
              current_run_id = os.environ.get("GITHUB_RUN_ID", "current")
              if not any(str(source.get("run_id")) == current_run_id for source in budget_sources):
                  budget_sources.append({"run_id": current_run_id, "used": current_used})
          total_used = prior_used + current_used
          cumulative_budget.write_text(
              json.dumps(
                  {"used": total_used, "limit": 99, "sources": budget_sources},
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          if total_used >= 100:
              raise SystemExit("cumulative TikHub request count is not below 100")
          print(f"Combined manifest verified: {len(items)}/{target}; TikHub cumulative {total_used}/99")
          PY
          echo "KC_COMBINED_PROCESSED=$combined_processed" >> "$GITHUB_ENV"
          echo "Verified exact output count: ${#videos[@]}"

      - name: Upload and verify in Jianguoyun
        if: env.KC_SKIP != 'true'
        run: |
          python xhs2vid/upload_jianguoyun.py \
            --source-dir "$KC_OUTPUT_DIR" \
            --remote-root "$JIANGUOYUN_REMOTE_ROOT" \
            --date "$KC_OUTPUT_DATE" \
            --category "Portal 娱乐" \
            --manifest "$KC_OUTPUT_DIR/jianguoyun_upload_manifest.json"

      - name: Require requested verified Jianguoyun uploads
        if: env.KC_SKIP != 'true'
        run: |
          python - "$KC_OUTPUT_DIR/jianguoyun_upload_manifest.json" "$KC_TARGET_COUNT" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          target = int(sys.argv[2])
          if payload.get("status") != "completed":
              raise SystemExit(f"Jianguoyun upload status is {payload.get('status')!r}")
          if int(payload.get("file_count", -1)) != target:
              raise SystemExit("Jianguoyun file_count does not match the requested count")
          if int(payload.get("verified_count", -1)) != target or int(payload.get("failed_count", -1)) != 0:
              raise SystemExit("Jianguoyun did not verify every requested MP4")
          print(f"Jianguoyun verified exactly {target}/{target} MP4 files")
          PY

      - name: Record uploaded posts for cross-day dedupe
        if: env.KC_SKIP != 'true'
        run: |
          python xhs2vid/record_processed.py \
            --new "$KC_COMBINED_PROCESSED" \
            --manifest xhs2vid/state/processed_note_ids.json

      - name: Commit only the dedupe ledger
        if: env.KC_SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xhs2vid/state/processed_note_ids.json
          if git diff --cached --quiet; then
            echo "No dedupe state change"
            exit 0
          fi
          git commit -m "Update XHS KC processed notes $KC_OUTPUT_DATE"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: xhs-lowfan-kc-${{ env.KC_OUTPUT_DATE }}
          path: |
            ${{ env.KC_OUTPUT_DIR }}
            work/xhs_daily/latest_run.txt
          if-no-files-found: warn
          retention-days: 7
